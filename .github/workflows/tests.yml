name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (no docker)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest tests.test_tools tests.test_agent_loop -v

  integration:
    name: integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: docker pull python:3.11
      - run: python -m unittest tests.test_docker_env -v
