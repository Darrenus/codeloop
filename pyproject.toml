[project]
name = "codeloop"
version = "0.1.0"
description = "A minimal, hackable terminal coding agent — built to study context engineering, edit formats, and sandboxing."
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40",
]

[project.scripts]
codeloop = "codeloop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
